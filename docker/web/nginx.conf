# 本文件按官方 nginx 镜像 conf.d/*.conf 的方式被 include 进 http 上下文 —— log_format 只允许在
# http 级，能写在这里正是靠这个前提；挂载方式变了（比如整替 nginx.conf）要先搬走它。
# 慢问数排查口径：rt=nginx 侧总耗时，urt=后端耗时，差值即 nginx/网络排队。
log_format dms_timing '$remote_addr - $time_local "$request" $status $body_bytes_sent '
                      'rt=$request_time urt=$upstream_response_time';

server {
    listen 80;
    listen [::]:80;
    server_name _;
    # 错误页/Server 头不泄露 nginx 精确版本号
    server_tokens off;
    # KB 上传 20MB > nginx 默认 1m（2026-08-10 部署实测坑）。
    # 25m 而非 20m：后端产品口径单文件 ≤20MB（crates/server/src/db.rs），余量给 multipart 开销；
    # 改成 20m 会让 20MB 整的文件在 nginx 层 413，而不是走后端 JSON 拒绝，边界更困惑。
    client_max_body_size 25m;
    # MIME 嗅探面（/api JSON、上传文件预览）统一关掉
    add_header X-Content-Type-Options nosniff;

    # gzip：SPA 静态资源（~1.1MB 文本可压 ~70%）与 /api JSON（trace/KB 预览常数百 KB）
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;
    # 响应带 Vary: Accept-Encoding —— 共享缓存别把压缩副本发给不支持 gzip 的客户端
    gzip_vary on;
    # 站点置于 CDN/上层代理之后（请求带 Via）也要压 /api，否则上面的承诺静默失效
    gzip_proxied any;

    # 文件来源：docker/web 下没有 Dockerfile，web/dist 构建产物靠运行时挂载进这个路径
    root /usr/share/nginx/html;
    index index.html;

    # 裸 /api（无尾斜杠）与拼错的类 API 路径别落进 SPA 兜底返 200 HTML —— 调试时会把 HTML 当 API 响应
    location = /api { return 404; }

    location /api/ {
        # host.docker.internal 在 nginx **启动期**解析：仅 Docker Desktop 可用；Linux 裸机需
        # --add-host 或改 IP，否则 nginx emerg 拒启（全站宕，不只是 /api 挂）
        proxy_pass http://host.docker.internal:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 与后端/文档侧的 300 秒熔断约定对齐（serve.ps1:24 注释）—— 任一侧改值另一侧要同步
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # 后端宕机 5s 内快速 502，别让用户干等默认 60s 以为是慢查询
        proxy_connect_timeout 5s;
        # 后端宕机给 /api 调用方 JSON 体：收到 HTML 前端错误处理会走错分支
        error_page 502 503 504 = @api_down;
        access_log /var/log/nginx/access.log dms_timing;
    }

    # vite 产物带 content hash（/assets/index-<hash>.js）：immutable 长缓存，
    # 别每次访问都对 ~1.1MB 资产逐个发条件请求重验证
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # HTML 不缓存：旧 HTML 引用已删除的 hash 资产 = 发版后白屏
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端宕机兜底：SPA 给用户友好页（/api 在上面 location 里已被 @api_down 接走）。
    # 只拦 nginx 自己产生的 502/503/504（后端不可达）；后端主动返的 50x 原样透传，不动。
    error_page 502 503 504 = @site_down;
    location @site_down {
        default_type text/html;
        charset utf-8;
        return 502 '<!doctype html><meta charset="utf-8"><title>服务暂不可用</title><body style="font-family:sans-serif;text-align:center;margin-top:4em"><h2>后端服务暂不可用</h2><p>请稍后刷新重试；若持续出现请联系管理员。</body>';
    }
    location @api_down {
        default_type application/json;
        charset utf-8;
        return 502 '{"error":"后端服务暂不可用，请稍后重试"}';
    }
}
