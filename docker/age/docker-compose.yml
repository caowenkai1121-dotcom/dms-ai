services:
  dms-ai-pg:
    build: .
    image: dms-ai-pg  # 不指定则镜像名由 project 目录名派生（age-dms-ai-pg 之类），docker images 里认不出归属
    container_name: dms-ai-pg  # 有意写死：单实例部署，run.ps1:16 按这个名字判活；要起第二套实例得先改名
    restart: unless-stopped
    stop_grace_period: 60s  # 默认 10s 后 SIGKILL，PG 大事务停机可能被硬切
    environment:
      # 显式钉死（不写默认也是它）：settings 的 pg_url 用户名必须恰好是 postgres，错位参考 DEPLOY.md:36 的坑
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DMS_AI_PG_PASSWORD:?set DMS_AI_PG_PASSWORD（或由 scripts/run.ps1 自动注入）}
      POSTGRES_DB: dms_ai
    ports:
      # 偏移到 15433：避让本机可能已装的 PG（5432）。
      # 🔴 绑定地址必须可变：容器里的 API 走 `host.docker.internal`（= Docker 网桥网关
      # 172.17.0.1）连 PG，而 127.0.0.1 只绑宿主回环，容器**连不上** —— 现网因此绑的是
      # 172.17.0.1。默认值保持 127.0.0.1（本机开发不对外开放），服务器侧由
      # `scripts/server-bootstrap.sh` 传 DMS_AI_PG_BIND=172.17.0.1。
      - "${DMS_AI_PG_BIND:-127.0.0.1}:15433:5432"
    volumes:
      - dms_ai_pgdata:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # run.ps1:16 只按容器名判「PG 已运行」；initdb/崩溃恢复期不算通过，后续步骤靠这个等
      test: ["CMD-SHELL", "pg_isready -U postgres -d dms_ai"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:  # json-file 日志无界增长的兜底
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dms_ai_pgdata:
