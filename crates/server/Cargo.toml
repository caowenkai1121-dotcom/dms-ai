[package]
name = "dms-ai-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# 迁移目标 crate：T1 只挂 path 依赖、不 use，保证 cargo build 行为不变且 cargo tree 无反向边。
# 之后每一步把对应模块搬过去，server 逐步瘦成薄壳（装配 + 协议 + 认证收口）。
dms-kernel = { path = "../kernel" }
dms-connector = { path = "../connector" }
dms-policy = { path = "../policy" }
dms-semantic = { path = "../semantic" }
dms-knowledge = { path = "../knowledge" }
dms-agent = { path = "../agent" }

anyhow = { workspace = true }
# D1：settings 凭据 AES-GCM（`db::crypto`）—— 锁树已有，见根 Cargo.toml 注释
ring = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { workspace = true }
sqlparser = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }
sqlx = { workspace = true }
